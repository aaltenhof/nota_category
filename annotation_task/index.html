<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title> Contrast Annotation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            color: #222;
            background: white;
        }
        button {
            font-family: sans-serif;
        }
        .btn {
            padding: 10px 20px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }
        .btn:hover {
            border-color: #3498db;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-primary {
            background: #3498db;
            border-color: #3498db;
            color: white;
        }

        /* ─── Start screen ───────────────────────────────────────────────── */
        #start-screen {
            max-width: 560px;
            margin: 60px auto;
            padding: 0 16px;
            line-height: 1.6;
        }
        .field {
            margin: 18px 0;
        }
        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .field small {
            display: block;
            color: #777;
        }
        .field input[type="text"] {
            font-size: 15px;
            padding: 6px 8px;
            width: 120px;
        }
        #start-error {
            color: #e74c3c;
            min-height: 20px;
        }

        /* ─── App layout: sidebar + main ─────────────────────────────────── */
        #app {
            display: none;
        }
        #sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 220px;
            box-sizing: border-box;
            padding: 14px;
            border-right: 1px solid #ddd;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .unit-title {
            font-weight: bold;
            font-size: 16px;
        }
        .unit-meta {
            font-size: 13px;
            color: #666;
        }
        #target-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin: 6px 0;
        }
        .target-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            border: 1px solid transparent;
            border-radius: 6px;
            background: none;
            padding: 5px 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .target-btn:hover {
            background: #eef2f7;
        }
        .target-btn.current {
            border-color: #3498db;
            background: #eaf4fc;
        }
        .target-pos {
            font-size: 11px;
            color: #999;
            margin-left: 4px;
        }
        .target-status.done {
            color: #27ae60;
        }
        .target-status.partial {
            color: #e67e22;
        }
        #save-note {
            font-size: 12px;
            color: #888;
        }
        #save-note.unsaved {
            color: #e67e22;
        }
        #main {
            margin-left: 220px;
            padding: 16px 24px 40px 24px;
            text-align: center;
        }
        #nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(1150px, 100%);
            margin: 18px auto 0 auto;
        }

        /* ─── Sentence frame ─────────────────────────────────────────────── */
        .frame {
            font-size: 26px;
            margin: 10px 0 6px 0;
        }
        .word-highlight {
            font-weight: bold;
            color: #2563eb;
        }
        .frame-blank {
            letter-spacing: 1px;
            color: #999;
        }

        /* ─── Sorting layout: response bank on the left, groups on the right ── */
        #sort-task {
            width: min(1150px, 100%);
            margin: 0 auto;
        }
        .task-hint {
            font-size: 14px;
            color: #555;
            margin: 0 0 14px 0;
        }
        #sort-columns {
            display: flex;
            gap: 18px;
            align-items: flex-start;
            text-align: left;
        }
        #left-column {
            flex: 0 0 240px;
            position: sticky;
            top: 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        #group-area {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 14px;
            align-content: start;
        }
        .zone-title {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }
        .zone-subtitle {
            font-weight: normal;
            color: #888;
        }
        .chip-holder {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 40px;
        }

        /* drop zones */
        .drop-zone {
            border: 2px solid #ccc;
            border-radius: 12px;
            background: #f9f9f9;
            padding: 10px;
            transition: border-color 0.1s, background 0.1s;
        }
        .drop-zone.drag-over {
            border-color: #3498db;
            background: #eaf4fc;
        }
        #response-bank {
            min-height: 120px;
        }
        .exclude-zone {
            border-style: dashed;
            background: #f4f4f4;
        }
        .exclude-zone .zone-subtitle {
            display: block;
            font-size: 12px;
            margin-top: 2px;
        }
        .new-group-zone {
            border: 2px dashed #3498db;
            background: white;
            color: #3498db;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            user-select: none;
        }
        .new-group-zone small {
            font-weight: normal;
            color: #888;
            margin-top: 4px;
        }

        /* group boxes */
        .group-box {
            background: white;
            min-height: 150px;
        }
        .group-box.needs-label {
            border-color: #e67e22;
        }
        .group-header {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 8px;
        }
        .group-prompt {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .group-label,
        .group-setall {
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
            padding: 6px 8px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: white;
        }
        .group-setall {
            margin-top: 6px;
            font-size: 13px;
            color: #666;
        }

        /* notes */
        #notes-box {
            text-align: left;
            margin-top: 18px;
            font-size: 13px;
            color: #555;
        }
        #notes-box textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            font-family: sans-serif;
            font-size: 14px;
            padding: 6px 8px;
            border: 1px solid #bbb;
            border-radius: 6px;
            resize: vertical;
        }
        .group-remove {
            border: none;
            background: none;
            color: #aaa;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0 2px;
            margin-top: 16px;
        }
        .group-remove:hover {
            color: #e74c3c;
        }

        /* response chips */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: white;
            border: 2px solid #aaa;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: grab;
            user-select: none;
            touch-action: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.13);
        }
        .chip:hover {
            border-color: #3498db;
        }
        .chip-count {
            background: #eef2f7;
            color: #555;
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 12px;
            font-weight: normal;
        }

        /* per-answer relationship tag: only shown once the answer is in a group */
        .chip-tag {
            display: none;
            font-size: 12px;
            padding: 2px 4px;
            border: 1px solid #bbb;
            border-radius: 5px;
            background: white;
            max-width: 190px;
        }
        .group-box .chip-holder {
            flex-direction: column;
            align-items: stretch;
        }
        .group-box .chip {
            display: flex;
        }
        .group-box .chip-word {
            flex: 1;
            white-space: nowrap;
        }
        .group-box .chip-tag {
            display: inline-block;
        }
        .group-box .chip {
            flex-wrap: wrap;
        }
        .chip-followup {
            display: none;
            font-size: 12px;
            padding: 2px 4px;
            border: 1px solid #bbb;
            border-radius: 5px;
            background: #f7fbff;
            margin-left: auto;
        }
        .group-box .chip-followup.active {
            display: inline-block;
        }
        .chip.needs-followup .chip-followup {
            border-color: #e67e22;
            color: #e67e22;
        }
        .chip.needs-tag .chip-tag {
            border-color: #e67e22;
            color: #e67e22;
        }
        .chip.placeholder {
            opacity: 0.3;
        }
        .chip.ghost {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            cursor: grabbing;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22);
        }

        #sort-status {
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- ─── Start screen ──────────────────────────────────────────────────── -->
    <div id="start-screen">
        <h2>Contrast Annotation</h2>

        <div class="field">
            <label for="coder-input">Your initials</label>
            <input id="coder-input" type="text" maxlength="10" autocomplete="off">
        </div>

        <div class="field">
            <label for="unit-input">Work unit</label>
            <input id="unit-input" type="file" accept=".csv">
            <small>The work unit file (e.g. file5.csv).</small>
        </div>

        <div class="field">
            <label for="results-input">Your results so far (optional)</label>
            <input id="results-input" type="file" accept=".csv">
            <small>To pick up where you left off, upload the results file you downloaded last time for this work unit.</small>
        </div>

        <p id="start-error"></p>
        <button id="start-btn" class="btn btn-primary">Start</button>
    </div>

    <!-- ─── Annotation app ────────────────────────────────────────────────── -->
    <div id="app">
        <aside id="sidebar">
            <div class="unit-title" id="unit-title"></div>
            <div class="unit-meta" id="unit-meta"></div>
            <div class="unit-meta" id="progress"></div>
            <div id="target-list"></div>
            <button id="download-btn" class="btn btn-primary">Download results</button>
            <div id="save-note"></div>
        </aside>

        <main id="main">
            <div id="sort-container"></div>
            <div id="nav">
                <button id="prev-btn" class="btn">&larr; Previous</button>
                <span id="sort-status"></span>
                <button id="next-btn" class="btn">Next &rarr;</button>
            </div>
        </main>
    </div>
</body>
<script src="experiment.js"></script>
</html>
