<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title> Experiment</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.3.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        .consent-text {
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }
        .consent-text h3 {
            text-align: center;
        }
        .jspsych-btn {
            margin: 10px 5px;
            padding: 12px 24px;
            font-size: 16px;
        }
        .jspsych-content {
            max-width: 100%;
        }

        /* ─── Sentence frame ─────────────────────────────────────────────── */
        .frame {
            font-size: 26px;
            margin: 10px 0 6px 0;
        }
        .word-highlight {
            font-weight: bold;
            color: #2563eb;
        }
        .frame-blank {
            letter-spacing: 1px;
            color: #999;
        }

        /* ─── Sorting layout: response bank on the left, groups on the right ── */
        #sort-task {
            width: min(1150px, 94vw);
            margin: 0 auto;
            font-family: sans-serif;
        }
        .task-hint {
            font-size: 14px;
            color: #555;
            margin: 0 0 14px 0;
        }
        #sort-columns {
            display: flex;
            gap: 18px;
            align-items: flex-start;
            text-align: left;
        }
        #left-column {
            flex: 0 0 240px;
            position: sticky;
            top: 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        #group-area {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px;
            align-content: start;
        }
        .zone-title {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }
        .zone-subtitle {
            font-weight: normal;
            color: #888;
        }
        .chip-holder {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 40px;
        }

        /* drop zones */
        .drop-zone {
            border: 2px solid #ccc;
            border-radius: 12px;
            background: #f9f9f9;
            padding: 10px;
            transition: border-color 0.1s, background 0.1s;
        }
        .drop-zone.drag-over {
            border-color: #3498db;
            background: #eaf4fc;
        }
        #response-bank {
            min-height: 120px;
        }
        #nofit-zone {
            border-style: dashed;
            background: #f4f4f4;
        }
        .new-group-zone {
            border: 2px dashed #3498db;
            background: white;
            color: #3498db;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            user-select: none;
        }
        .new-group-zone small {
            font-weight: normal;
            color: #888;
            margin-top: 4px;
        }

        /* group boxes */
        .group-box {
            background: white;
            min-height: 120px;
        }
        .group-box.needs-label {
            border-color: #e67e22;
        }
        .group-header {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 8px;
        }
        .group-prompt {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .group-label {
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
            padding: 6px 8px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }
        .group-remove {
            border: none;
            background: none;
            color: #aaa;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0 2px;
            margin-top: 16px;
        }
        .group-remove:hover {
            color: #e74c3c;
        }

        /* response chips */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: white;
            border: 2px solid #aaa;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: grab;
            user-select: none;
            touch-action: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.13);
        }
        .chip:hover {
            border-color: #3498db;
        }
        .chip-count {
            background: #eef2f7;
            color: #555;
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 12px;
            font-weight: normal;
        }
        .chip.placeholder {
            opacity: 0.3;
        }
        .chip.ghost {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            cursor: grabbing;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22);
        }

        #sort-status {
            font-size: 13px;
            color: #999;
            margin-top: 14px;
        }
        #jspsych-continue-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body></body>
<script src="experiment.js"></script>
</html>
